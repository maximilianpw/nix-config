# Shell
shell bash -l -c nu

# Font
font_family JetBrainsMono Nerd Font
font_size 14.5
font_features JetBrainsMonoNF-Regular +zero +cv14
disable_ligatures always
text_composition_strategy platform
modify_font cell_height 105%
modify_font baseline 0

# Appearance
background_opacity 0.95
background_blur 20
hide_window_decorations no
mouse_hide_wait 0
undercurl_style thin-sparse

# Performance
repaint_delay 6
input_delay 1
sync_to_monitor yes

# Theme (Catppuccin Mocha)
foreground #cdd6f4
background #1e1e2e
cursor #f5e0dc
selection_foreground #1e1e2e
selection_background #f5e0dc

# Normal colors
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de

# Bright colors
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# Keybindings (alt-based, matching Ghostty config)
clear_all_shortcuts yes

# Clipboard
map alt+c        copy_to_clipboard
map alt+v        paste_from_clipboard
map alt+shift+c  copy_to_clipboard
map alt+shift+v  paste_from_clipboard

# Font size
map alt+equal    change_font_size all +1.0
map alt+minus    change_font_size all -1.0
map alt+0        change_font_size all 0

# Window management
map alt+q        quit
map alt+shift+,  load_config_file
map alt+k        clear_terminal scrollback active
map alt+n        new_os_window
map alt+w        close_window
map alt+shift+w  close_os_window

# Pass Alt+number to terminal (for tmux window switching)
map alt+1        send_text all \x1b1
map alt+2        send_text all \x1b2
map alt+3        send_text all \x1b3
map alt+4        send_text all \x1b4
map alt+5        send_text all \x1b5
map alt+6        send_text all \x1b6
map alt+7        send_text all \x1b7
map alt+8        send_text all \x1b8
map alt+9        send_text all \x1b9

# Tabs
map alt+t              new_tab
map alt+shift+[        previous_tab
map alt+shift+]        next_tab

# Splits (layouts)
enabled_layouts splits,stack
map alt+d        launch --location=vsplit --cwd=current
map alt+shift+d  launch --location=hsplit --cwd=current
map alt+]        next_window
map alt+[        previous_window

# macOS
macos_option_as_alt left
macos_colorspace displayp3
