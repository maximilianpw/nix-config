StylesPath = ~/.config/vale/styles
MinAlertLevel = suggestion
Packages = Google, alex, proselint, write-good

[*]
BasedOnStyles = Google, alex

# Tone & inclusivity
alex.Condescending = warning
alex.ProhibitedTerms = error

# Google tweaks for engineering READMEs
Google.Headings = warning
Google.Passive = suggestion
Google.Spacing = warning
Google.WordList = warning

# Trim proselint/write-good noise; enable a few helpful ones
proselint.Annotations = off
proselint.Cliches = off
proselint.Jargon = warning
proselint.Hedges = off
proselint.OxfordComma = warning

write-good.Weasel = off
write-good.TooWordy = off
write-good.Passive = off
write-good.E-Prime = off

# Ignore common engineering constructs to reduce false positives
# (URLs, code fences, shell prompts, paths, ports, JSON, etc.)
[*.md]
TokenIgnores = (\bhttps?://\S+\b)|(```[\s\S]*?```)|(`[^`]+`)|(\b[A-Za-z0-9_\-/.]+(?:\.rb|\.js|\.tsx|\.nix|\.yml)\b)|(\blocalhost:\d+\b)|("?[A-Za-z_][A-Za-z0-9_]*"\s*:)
