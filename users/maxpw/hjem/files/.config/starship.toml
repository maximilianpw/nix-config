# Catppuccin Mocha palette
palette = "catppuccin_mocha"

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$python\
$rust\
$golang\
$nix_shell\
$aws\
$kubernetes\
$docker_context
$character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"
vimcmd_replace_one_symbol = "[❮](bold peach)"
vimcmd_replace_symbol = "[❮](bold peach)"
vimcmd_visual_symbol = "[❮](bold mauve)"

[directory]
style = "bold green"
truncation_length = 3
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = ""
style = "blue"
format = "[$symbol$branch]($style)"

[git_status]
style = "mauve"
format = "( [$all_status$ahead_behind]($style))"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
conflicted = "=${count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
style = "overlay1"
format = "[  $duration]($style)"
min_time = 2_000

[python]
symbol = " "
style = "yellow"
format = "[ $symbol$virtualenv]($style)"

[rust]
symbol = " "
style = "peach"
format = "[ $symbol$version]($style)"

[golang]
symbol = " "
style = "teal"
format = "[ $symbol$version]($style)"

[nix_shell]
symbol = " "
style = "blue"
format = "[ $symbol$state($name)]($style)"

[aws]
symbol = " "
style = "peach"
format = "[ $symbol$profile($region)]($style)"

[kubernetes]
symbol = "󱃾 "
style = "blue"
format = "[ $symbol$context($namespace)]($style)"
disabled = true

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[nodejs]
disabled = true

[package]
disabled = true
