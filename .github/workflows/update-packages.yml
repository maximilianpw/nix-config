name: Update packages

on:
  schedule:
    # Sunday 16:00 UTC.
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names (default: repository update list)'
        required: false
        default: ''

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    name: Bump custom packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nix-setup
        with:
          cache: 'true'

      - name: Use the public Superlocal stub
        run: scripts/ci/use-superlocal-stub.sh

      - name: Run nix-update for each package
        id: bump
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          scripts/ci/update-packages.sh
          # The stub relock is CI-local; never propose it in the package PR.
          git checkout -- flake.lock

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.has_changes == 'true'
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/update-packages
          base: main
          commit-message: 'chore: bump custom packages'
          title: 'chore: bump custom packages'
          body: |
            Automated version bumps from `nix-update`, run by
            `.github/workflows/update-packages.yml`.

            CI runs lightweight checks and evaluates every host configuration.
            Full Kim, Cuno-image and Darwin builds require a separate manual
            CI run with full_builds enabled.

            ${{ steps.bump.outputs.failed_packages && format('> [!WARNING]\n> Packages that failed to update: `{0}`', steps.bump.outputs.failed_packages) || '' }}
          delete-branch: true

      - name: Dispatch lightweight CI for the update branch
        if: steps.create-pull-request.outputs.pull-request-operation == 'created' || steps.create-pull-request.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.create-pull-request.outputs.pull-request-branch }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run ci.yml --ref "$UPDATE_BRANCH" -f full_builds=false; then
              exit 0
            fi
            echo "CI dispatch attempt $attempt failed; retrying" >&2
            sleep 5
          done
          exit 1
