name: Update packages

on:
  schedule:
    # Sunday 16:00 UTC.
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names (default: updateable entries in packages/default.nix)'
        required: false
        default: ''

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    name: Bump custom packages
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Run nix-update for each package
        id: bump
        env:
          PACKAGES: ${{ github.event.inputs.packages }}
        run: scripts/ci/update-packages.sh

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.has_changes == 'true'
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/update-packages
          base: main
          commit-message: 'chore: bump custom packages'
          title: 'chore: bump custom packages'
          body: |
            Automated version bumps from `nix-update`, run by
            `.github/workflows/update-packages.yml`.

            CI builds `kim`, produces Cuno's WSL import image, and builds the
            Darwin system on a macOS runner.

            ${{ steps.bump.outputs.failed_packages && format('> [!WARNING]\n> Packages that failed to update: `{0}`', steps.bump.outputs.failed_packages) || '' }}
          delete-branch: true

      - name: Dispatch full CI for the update branch
        if: steps.create-pull-request.outputs.pull-request-operation == 'created' || steps.create-pull-request.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.create-pull-request.outputs.pull-request-branch }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run ci.yml --ref "$UPDATE_BRANCH"; then
              exit 0
            fi
            echo "CI dispatch attempt $attempt failed; retrying" >&2
            sleep 5
          done
          exit 1
