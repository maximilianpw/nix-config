name: Update flake inputs

on:
  schedule:
    # Monday 04:00 UTC, before the normal working day in Europe/Paris.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      inputs:
        description: 'Space-separated public flake inputs (empty: all public inputs)'
        type: string
        required: false
        default: ''

concurrency:
  group: update-flake-inputs
  cancel-in-progress: false

jobs:
  update:
    name: Refresh flake.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/nix-setup
        with:
          cache: 'true'

      # superlocal stays local-only. Capture selection before reading the array
      # so validation failures cannot turn into an unscoped `nix flake update`.
      - name: Update selected public flake inputs
        id: selection
        env:
          FLAKE_INPUTS: ${{ inputs.inputs }}
        run: |
          selected=$(bash scripts/ci/select-flake-inputs.sh)
          mapfile -t inputs <<< "$selected"
          nix flake update "${inputs[@]}"
          echo "names=${inputs[*]}" >> "$GITHUB_OUTPUT"
          branch=automated/update-flake-inputs
          if [[ -n ${FLAKE_INPUTS//[[:space:]]/} ]]; then
            # A stable branch per normalized selection keeps targeted PRs
            # separate from the weekly all-input refresh.
            digest=$(printf '%s\n' "$selected" | sha256sum | cut -c1-12)
            branch="$branch-$digest"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Evaluate the updated flake before opening a PR
        run: nix flake check --no-build --no-write-lock-file --override-input superlocal path:./tests/stubs/superlocal

      - name: Open pull request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ steps.selection.outputs.branch }}
          base: main
          commit-message: 'chore: update flake inputs'
          title: 'chore: update flake inputs'
          body: |
            Refresh of `flake.lock` for: ${{ steps.selection.outputs.names }}.

            The workflow evaluates the updated flake before opening this PR,
            then dispatches lightweight CI checks on this branch. Full host
            builds require a separate manual CI run with full_builds enabled.
            Merge and host activation remain manual.
          delete-branch: true

      - name: Dispatch lightweight CI for the update branch
        if: steps.create-pull-request.outputs.pull-request-operation == 'created' || steps.create-pull-request.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.create-pull-request.outputs.pull-request-branch }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run ci.yml --ref "$UPDATE_BRANCH" -f full_builds=false; then
              exit 0
            fi
            echo "CI dispatch attempt $attempt failed; retrying" >&2
            sleep 5
          done
          exit 1
